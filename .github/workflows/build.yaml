name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.15.0-alpha.26). Leave empty to build current HEAD.'
        required: false
        type: string

permissions:
  contents: write

# Fork pipeline: Android + Windows only.
# iOS / macOS / App Store / Play Store jobs were removed because they need
# Apple & Google signing credentials that are not configured on this fork.
jobs:
  setup:
    uses: ./.github/workflows/setup.yaml
    with:
      tag: ${{ inputs.tag }}
    secrets:
      NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}

  build-android:
    needs: setup
    uses: ./.github/workflows/build-android.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
      flutter_version: ${{ needs.setup.outputs.flutter_version }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

  build-windows:
    needs: setup
    uses: ./.github/workflows/build-windows.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
      flutter_version: ${{ needs.setup.outputs.flutter_version }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}

  release:
    needs: [setup, build-android, build-windows]
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.setup.outputs.tag }}
      version: ${{ needs.setup.outputs.version }}
      is_alpha: ${{ needs.setup.outputs.is_alpha }}
      is_beta: ${{ needs.setup.outputs.is_beta }}
      release_notes: ${{ needs.setup.outputs.release_notes }}
    secrets:
      NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
